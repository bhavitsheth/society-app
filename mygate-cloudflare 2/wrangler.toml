# Reference config — Cloudflare Pages reads its bindings from the dashboard,
# not this file. wrangler.toml is here purely for documentation and for users
# who want to deploy via the wrangler CLI later.

name = "mygate-prototype"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "mygate-d1"
# database_id = "<set in dashboard>"
