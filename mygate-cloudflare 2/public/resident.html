<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Resident · SocietyApp</title>
<link rel="stylesheet" href="/styles.css" />
<!-- QR code generator (pure JS, used to render QR images client-side) -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">S</span><span>SocietyApp</span></div>
  <span class="who" id="who"></span>
</header>

<main class="app">
  <div id="banner-slot"></div>

  <div class="tabs">
    <button data-tab="invite" class="active">Invite</button>
    <button data-tab="list">My invites</button>
    <button data-tab="history">History</button>
  </div>

  <section id="tab-invite" class="tab">
    <div class="card">
      <h2>Pre-invite a visitor</h2>
      <p class="muted" style="margin-top:0">Generate a one-time QR your visitor shows at the gate.</p>

      <form id="invite-form">
        <label>Visitor name *</label>
        <input name="visitor_name" required placeholder="e.g. Ankit Kumar" />

        <label>Visitor phone</label>
        <input name="visitor_phone" type="tel" placeholder="+91 …" />

        <label>Visit type *</label>
        <select name="visit_type" required>
          <option value="Guest">Guest</option>
          <option value="Delivery">Delivery</option>
          <option value="Cab">Cab</option>
          <option value="Service">Service</option>
        </select>

        <label>Expected arrival *</label>
        <input name="expected_at" type="datetime-local" required />
        <p class="muted" style="margin:4px 0 0">QR will be valid until 2 hours after this time.</p>

        <label>Notes</label>
        <textarea name="notes" placeholder="(optional)"></textarea>

        <div style="height:12px"></div>
        <button type="submit" class="full">Generate QR</button>
      </form>
    </div>
  </section>

  <section id="tab-list" class="tab" style="display:none">
    <div class="card">
      <h2>My invites</h2>
      <div id="invite-list"></div>
    </div>
  </section>

  <section id="tab-history" class="tab" style="display:none">
    <div class="card">
      <h2>Visit history</h2>
      <div id="history-list"></div>
    </div>
  </section>

  <p style="text-align:center; margin-top:24px">
    <button class="ghost" onclick="logout()">Sign out</button>
  </p>
</main>

<div id="qr-modal" class="modal-backdrop">
  <div class="modal">
    <h2>Share this QR with your visitor</h2>
    <div class="qr-wrap">
      <img id="qr-img" alt="QR" />
      <div class="qr-info">
        <div id="qr-visitor" style="font-weight:600"></div>
        <div class="muted" id="qr-meta"></div>
      </div>
    </div>
    <div class="row" style="gap:8px">
      <button id="qr-share" class="full secondary">Share</button>
      <button id="qr-close" class="full">Done</button>
    </div>
  </div>
</div>

<div id="walkin-modal" class="modal-backdrop">
  <div class="modal">
    <h2>Visitor at the gate</h2>
    <div id="walkin-content"></div>
    <div class="row" style="gap:8px; margin-top:12px">
      <button id="walkin-reject" class="full danger">Reject</button>
      <button id="walkin-approve" class="full success">Approve</button>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/resident.js"></script>
</body>
</html>
